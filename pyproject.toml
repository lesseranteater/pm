[project]
name = "project-management-mvp"
version = "0.1.0"
description = "Local Project Management MVP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1"
]

[dependency-groups]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
