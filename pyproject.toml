[project]
name = "svelte-fastapi-starter"
version = "0.1.0"
description = "Minimal Svelte and FastAPI starter application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jira>=3.10,<4",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
